<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin</title>

    <link rel="stylesheet" href="./css/mobile/admin.css" />
    <link rel="stylesheet" href="./css/admin.css" />
    <link rel="stylesheet" href="./css/desktop/admin.css">
    <link rel="stylesheet" href="./css/main.css" />
        <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    /> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  </head>
  <body>
    <div class="admin-container">
      <div class="admin-header">
        <h2>Admin panel</h2>
        <button id="Logout-btn" class="Logout-btn">Logout</button>
      </div>
      <h3>User list</h3>
      <table id="user-list">
        <thead>
          <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <!-- <tr>
            <td>Negar</td>
            <td>Farahani</td>
            <td>negarfar@gmail.com</td>
            <td>admin</td>
            <td>
              <button class="edit-btn" data-id="${user.id}">
                <i class="fas fa-edit"></i>Edit
              </button>
              <button class="delet-btn">
                <i class="fas fa-trash-alt"></i>Delete
              </button>
            </td>
          </tr> -->
        </tbody>
      </table>
    </div>
      <div id="edit-user-modal" class="modal">
           <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3>Edit User</h3>
            <form action="" id="edit-user-form">
                <div class="input-group">
                    <label for="edit-firstname">Farst Name</label>
                    <input type="text" id="edit-firstname" placeholder="Enter your first name" required>
                </div>
                <div class="input-group">
                    <label for="edit-lastname">Last Name</label>
                    <input type="text" id="edit-lastname" placeholder="Enter your last name" required>
        
                </div>
                <div class="input-group">
                    <label for="edit-age">Age</label>
                    <input type="number" id="edit-age" placeholder="Enter your age" required>
                
                </div>
                <div class="input-group">
                    <label for="edit-email">Email</label>
                    <input type="email" id="edit-email" placeholder="Enter your email" required>
                
                </div>
                <div class="input-group">
                    <label for="edit-password">Password</label>
                    <input type="password" id="edit-password" placeholder="Enter your password" required>
                        <div class="icon">
              <i class="fa-solid fa-eye"></i>
              <i class="fa-solid fa-eye-slash hide"></i>
            </div>
                </div>
                <div class="input-group">
                    <label for="edit-role">Role</label>
                    <select name="" id="edit-role">
                        <option value="user">user</option>
                        <option value="admin">admin</option>
                    </select>
                
                </div>
                <button type="submit" class="edit-user-btn"> save change</button>
            </form>
           </div>
        </div>
    <script src="./js/admin.js"></script>
  </body>
</html>
